<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil - SquadFinder LFG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand" href="index.html">SquadFinder LFG</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-principal"
                aria-controls="nav-principal" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav-principal">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="crear_post.html">Crear búsqueda</a>
                    <a class="nav-link" href="historial_partidas.html">Historial</a>
                    <a class="nav-link" href="perfil_config.html">Mi perfil</a>
                    <a class="btn btn-primary ms-lg-2 mt-2 mt-lg-0" href="login.html">Entrar</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4" style="max-width: 600px;">
        <h1>Mi perfil</h1>
        <p class="text-secondary">Honor Score: <span id="honor-score" class="badge bg-success">0.0</span></p>
        <form id="form-perfil" class="mt-3">
            <div class="mb-3">
                <label class="form-label">Idioma de la interfaz</label>
                <select class="form-select" id="ui-language">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Juegos habituales</label>
                <input type="text" class="form-control" id="juegos">
            </div>
            <div class="mb-3">
                <label class="form-label">Filtro anti-toxicidad</label>
                <select class="form-select" id="filtro">
                    <option value="STRICT">Estricto</option>
                    <option value="MEDIUM">Medio</option>
                    <option value="OFF">Apagado</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </form>
        <h4 class="mt-5">Cuentas vinculadas</h4>
        <ul class="list-group">
            <li class="list-group-item bg-dark text-light d-flex justify-content-between">Discord <button
                    class="btn btn-sm btn-outline-danger">Desvincular</button></li>
            <li class="list-group-item bg-dark text-light d-flex justify-content-between">Steam <button
                    class="btn btn-sm btn-outline-danger">Desvincular</button></li>
            <li class="list-group-item bg-dark text-light d-flex justify-content-between">Twitch <button
                    class="btn btn-sm btn-outline-danger">Desvincular</button></li>
        </ul>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
