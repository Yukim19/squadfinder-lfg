<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear búsqueda - SquadFinder LFG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand" href="index.html">SquadFinder LFG</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-principal"
                aria-controls="nav-principal" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav-principal">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="crear_post.html">Crear búsqueda</a>
                    <a class="nav-link" href="historial_partidas.html">Historial</a>
                    <a class="nav-link" href="perfil_config.html">Mi perfil</a>
                    <a class="btn btn-primary ms-lg-2 mt-2 mt-lg-0" href="login.html">Entrar</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4" style="max-width: 600px;">
        <h1>Crear búsqueda de equipo</h1>
        <form id="form-post" class="mt-4">
            <div class="mb-3">
                <label class="form-label">Juego</label>
                <input type="text" class="form-control" id="game-title" required>
            </div>
            <div class="row mb-3">
                <div class="col">
                    <label class="form-label">Plataforma</label>
                    <select class="form-select" id="platform">
                        <option>PC</option>
                        <option>PlayStation</option>
                        <option>Xbox</option>
                        <option>Switch</option>
                    </select>
                </div>
                <div class="col">
                    <label class="form-label">Cupos</label>
                    <input type="number" class="form-control" id="max-players" min="2" max="10" value="5">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Rango requerido</label>
                <input type="text" class="form-control" id="rank-required" placeholder="Oro, Diamante...">
            </div>
            <div class="mb-3">
                <label class="form-label">Idioma requerido</label>
                <select class="form-select" id="required-language">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="mic-required">
                <label class="form-check-label" for="mic-required">Se requiere micrófono</label>
            </div>
            <button type="submit" class="btn btn-primary">Publicar</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
